schema: spec-driven

context: |
  产品：琥珀音乐 / AmberMusic，跨平台个人音乐播放器（iOS + Android）。
  仓库名 amber-music，包名与 Bundle ID 均为 com.ambermusic.app。英文名固定连写 AmberMusic，
  不单独使用 Amber（避免与 GNOME Amberol 混淆）。完整功能地图与 change 路线图见 openspec/PRODUCT.md。

  核心理念：音源与播放器彻底解耦——应用本身不提供、不内置、不分发任何音源，只播放用户自己
  拥有或自己指定的资源（本地文件、远程直链、个人网盘、用户自行安装的插件）。这既解决会员墙
  与曲目消失的问题，也规避版权风险。

  技术栈（已锁定，决策记录见 changes/bootstrap-music-player/design.md）：
  - Expo SDK 57 / React Native 0.86，Development Build 工作流，EAS Build 构建
  - TypeScript，pnpm 作为包管理工具
  - react-native-track-player 作为播放引擎
  - expo-sqlite 作为曲库存储

  关键架构约束：
  - 曲库层与播放层不感知曲目来源。所有来源实现同一解析契约：可播放地址 + HTTP 请求头 + User-Agent
  - 曲目记录保存「重新解析所需的信息」，不保存解析结果（网盘与插件返回的地址有时效性）
  - 本地文件与网盘是宿主内置来源，插件是受限沙箱来源，二者实现同一契约

  分发与合规：
  - 应用商店上架 + 代码开源，两条路都要走
  - 插件系统在 iOS 上无法合规上架，必须做成编译期可裁剪模块；核心能力不得依赖插件模块
  - 参考 MusicFree（AGPL-3.0）的协议规范与设计思路，禁止复制其源代码

  文档约定：所有 OpenSpec 产物使用简体中文书写。

rules:
  proposal:
    - 必须显式写出非目标，并说明该项被排除的原因（阻塞、正交、或属于其他 change）
  design:
    - 每条决策必须包含备选方案与未采纳的理由
    - 已作废的历史约束要显式标注为作废，不能留在文档里造成误导
